name: Bug report
description: Report a reproducible problem in Cooder
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include passwords, API keys, private project files, personal
        information or unredacted conversation logs. For security
        vulnerabilities, use the private reporting instructions in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cooder version or commit
      placeholder: 'For example: v1.2.3 or a commit SHA'
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local install
        - Docker Compose
        - Development setup
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, browser and provider CLI versions. Do not include secrets.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data before sharing.
    validations:
      required: false
